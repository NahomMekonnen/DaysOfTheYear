[versions]
agp = "9.0.0"
kotlin = "2.2.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.12.2"
composeBom = "2024.09.00"
# Room

room_version = "2.8.4"
# Hilt
hilt_version = "2.59.1"
# Ksp
ksp_version = "2.3.4"
# Splash Screen
splashScreen = "1.0.0"
appcompat = "1.7.1"
# Lottie
lottie = "6.7.1"
lottie_version = "0.5.0"
material = "1.10.0"
activity = "1.12.4"
constraintlayout = "2.1.4"
material3WindowSizeClass = "1.4.0"
adaptive = "1.2.0"
uiUnit = "1.10.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Splash Screen
androidx-core-core-splashscreen = {group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen"}
# Room
androidx-room-runtime = {group = "androidx.room", name = "room-runtime", version.ref = "room_version"}
androidx-room-room-compiler = {group = "androidx.room", name = "room-compiler", version.ref = "room_version" }
#hilt
dagger-hilt-android = {group = "com.google.dagger", name = "hilt-android", version.ref = "hilt_version"}
dagger-hilt-compiler = {group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt_version"}
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# lottie
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
lottiefiles-dotlottie-android = { group = "com.github.LottieFiles", name = "dotlottie-android", version.ref = "lottie_version"}
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-compose-material3-window-size-class1 = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3WindowSizeClass" }
androidx-compose-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
androidx-compose-ui-unit = { group = "androidx.compose.ui", name = "ui-unit", version.ref = "uiUnit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dagger-hilt-android = { id =  "com.google.dagger.hilt.android", version.ref = "hilt_version"}
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp_version"}

